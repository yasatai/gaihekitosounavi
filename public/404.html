<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>ページが見つかりません（404）｜外壁・屋根塗装ナビ</title>
  <style>
    :root {
      --navy: #15304d;
      --navy-deep: #0f2236;
      --gold: #b8923f;
      --text: #56707d;
      --line: #e7edf3;
      --bg-soft: #f5f8fb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--navy);
      background: linear-gradient(160deg, var(--navy-deep) 0%, var(--navy) 60%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      line-height: 1.8;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border-radius: 18px;
      padding: clamp(32px, 6vw, 56px) clamp(24px, 5vw, 48px);
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .25);
    }
    .code {
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
      font-size: clamp(64px, 16vw, 104px);
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--gold);
      line-height: 1;
    }
    h1 {
      font-size: clamp(19px, 4.4vw, 24px);
      font-weight: 700;
      margin: 18px 0 14px;
    }
    p {
      font-size: 15px;
      color: var(--text);
      margin-bottom: 8px;
    }
    .actions {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .88; }
    .btn-primary { background: var(--navy); color: #fff; }
    .btn-ghost { background: var(--bg-soft); color: var(--navy); border: 1px solid var(--line); }
    .links {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      justify-content: center;
      font-size: 14px;
    }
    .links a { color: var(--navy); text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>お探しのページが見つかりませんでした</h1>
    <p>ページが移動または削除されたか、URL が正しくない可能性があります。</p>
    <p>以下からお目当ての情報をお探しください。</p>

    <div class="actions">
      <a class="btn btn-primary" href="/">トップページへ戻る</a>
      <a class="btn btn-ghost" href="/#contact-link">無料相談・お見積もりはこちら</a>
    </div>

    <nav class="links" aria-label="主要ページ">
      <a href="/#service-link">サービス紹介</a>
      <a href="/#sekou-link">施工事例</a>
      <a href="/#meyasu-link">費用の目安</a>
      <a href="/#faq-link">よくある質問</a>
      <a href="/privacy-policy/">プライバシーポリシー</a>
    </nav>
  </main>
</body>
</html>
