<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <style>
    /* 実線はそのまま。上に明るい色のセグメントを流して「色が動く」表現 */
    .travel  { stroke-dasharray: 90 460; animation: travel 5s linear infinite; }
    .travel2 { stroke-dasharray: 90 460; animation: travel 7s linear infinite; }
    @keyframes travel { to { stroke-dashoffset: -550; } }
    @media (prefers-reduced-motion: reduce) {
      .travel, .travel2 { animation: none; opacity: 0; }
    }
  </style>
  <!-- 右上（ネイビー） -->
  <g fill="none" stroke-width="1.4">
    <g stroke="#15304d" stroke-opacity="0.09">
      <circle cx="1440" cy="0" r="200"/>
      <circle cx="1440" cy="0" r="320"/>
      <circle cx="1440" cy="0" r="440"/>
      <circle cx="1440" cy="0" r="560"/>
      <circle cx="1440" cy="0" r="680"/>
    </g>
    <g class="travel" stroke="#2a5a86" stroke-opacity="0.30">
      <circle cx="1440" cy="0" r="200"/>
      <circle cx="1440" cy="0" r="320"/>
      <circle cx="1440" cy="0" r="440"/>
      <circle cx="1440" cy="0" r="560"/>
      <circle cx="1440" cy="0" r="680"/>
    </g>
  </g>
  <!-- 左下（ゴールド） -->
  <g fill="none" stroke-width="1.4">
    <g stroke="#b8923f" stroke-opacity="0.11">
      <circle cx="0" cy="900" r="170"/>
      <circle cx="0" cy="900" r="290"/>
      <circle cx="0" cy="900" r="410"/>
    </g>
    <g class="travel2" stroke="#cba968" stroke-opacity="0.34">
      <circle cx="0" cy="900" r="170"/>
      <circle cx="0" cy="900" r="290"/>
      <circle cx="0" cy="900" r="410"/>
    </g>
  </g>
</svg>
